name: Chaine Rust
description: >-
  Installe la chaine Rust epinglee dans rust-toolchain.toml (seule source de
  la version) avec rustfmt et clippy, puis restaure le cache Cargo du moteur
  et du paquet integrations.

inputs:
  composants:
    description: Composants rustup supplementaires, separes par des virgules (ex. llvm-tools-preview)
    required: false
    default: ""
  cle-cache:
    description: Complement de la cle du cache Cargo (jobs qui compilent differemment)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Chaine Rust de rust-toolchain.toml
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        P_E_C_Composants: ${{ inputs.composants }}
      run: |
        V_C_Chaine="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
        if [ -z "${V_C_Chaine}" ]
        then
          echo "::error file=rust-toolchain.toml::canal Rust introuvable"
          exit 1
        fi
        V_C_Composants="rustfmt,clippy"
        if [ -n "${P_E_C_Composants}" ]
        then
          V_C_Composants="${V_C_Composants},${P_E_C_Composants}"
        fi
        rustup toolchain install "${V_C_Chaine}" --profile minimal --component "${V_C_Composants}"
        rustup default "${V_C_Chaine}"
        rustc --version
        cargo --version

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          engine -> target
          integrations -> target
        key: ${{ inputs.cle-cache }}
